<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="A local research lab for collective AI. Propose, coordinate, verify, and build in the open.">
  <title>Emergence Lab</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="stylesheet" href="/style.css">
  <script src="/missions.js" defer></script>
  <script src="/app.js" defer></script>
</head>
<body>
  <a class="skip" href="#content">Skip to workspace</a>
  <div class="shell simple-shell">
    <div class="main-shell">
      <header class="lab-header">
        <a class="lab-brand" href="#overview"><img src="/favicon.svg" alt="" width="27" height="27">emergence</a>
        <nav class="lab-nav" aria-label="Workspace">
          <a href="#overview" data-nav="overview">Overview</a>
          <a href="#atlas" data-nav="atlas">Sources</a>
          <details class="records-menu" id="records-menu">
            <summary>Records</summary>
            <div class="records-links">
              <a href="#history" data-nav="history">Mission history</a>
              <span>Manual workspace</span>
              <a href="#manual" data-nav="manual">Lab records</a>
              <a href="#proposals" data-nav="proposals">Proposals</a>
              <a href="#jobs" data-nav="jobs">Work queue</a>
              <a href="#findings" data-nav="findings">Artifacts</a>
              <a href="#agents" data-nav="agents">Workers</a>
            </div>
          </details>
        </nav>
        <span id="crumb" class="sr-only">Overview</span>
        <button class="quiet-button" id="refresh" aria-label="Refresh workspace">↻</button>
      </header>
      <main id="content" tabindex="-1"><div class="loading">Opening your lab…</div></main>
      <footer><span>Local workspace · ChatGPT subscription</span><a href="/api/export" download>Export records</a></footer>
    </div>
  </div>
  <dialog id="modal"><div class="dialog-header"><h2 id="modal-title">New proposal</h2><button id="close-modal" class="quiet-button" aria-label="Close dialog">×</button></div><div id="modal-body"></div></dialog>
  <div id="toast" role="status" aria-live="polite" hidden></div>
</body>
</html>
